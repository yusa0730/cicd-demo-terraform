misconfigurations:
  # Demo ALB is intentionally public to expose the application over HTTP without a custom domain.
  - id: AVD-AWS-0053
    statement: "Demo ALB is intentionally internet-facing; no private ALB required for this demo."

  # HTTPS listener requires ACM certificate and custom domain, which are out of scope for this CI/CD demo.
  - id: AVD-AWS-0054
    statement: "HTTPS/ACM/custom domain setup is out of scope for this CI/CD demo."

  # App uses password-based authentication to the database; IAM Database Authentication is not configured.
  - id: AVD-AWS-0176
    statement: "App uses password-based auth; IAM Database Authentication is out of scope for this demo."

  # Deletion protection is disabled to support terraform destroy workflows in dev/stg environments.
  - id: AVD-AWS-0177
    statement: "Deletion protection disabled to allow destroy workflows in dev/stg."

  # Aurora Backtrack は Aurora MySQL のみサポート。Aurora PostgreSQL では機能自体が存在しない。
  - id: AVD-AWS-0080
    statement: "Aurora Backtrack is not available for Aurora PostgreSQL; only Aurora MySQL supports this feature."

  # Bastion EC2 detailed monitoring is out of scope for this CI/CD demo.
  - id: AVD-AWS-0014
    statement: "EC2 detailed monitoring is out of scope for this CI/CD demo bastion host."

  # RDS uses AWS-managed encryption key (storage_encrypted = true); CMK is out of scope for this demo.
  - id: AVD-AWS-0079
    statement: "Aurora cluster uses AWS-managed key encryption; CMK is not required for this CI/CD demo."

  # RDS Performance Insights disabled in demo environments to reduce cost.
  - id: AVD-AWS-0133
    statement: "Performance Insights is disabled to reduce cost in dev/stg demo environments."

  # Aurora cluster deletion protection disabled to allow destroy workflows in dev/stg.
  - id: AVD-AWS-0343
    statement: "Deletion protection disabled to allow terraform destroy workflows in dev/stg."
