name: bootstrap

# Per-account bootstrap: creates OIDC Provider, IAM roles, and S3 state bucket
# in the target environment's AWS account.
# Run once per environment (dev → stg → prod).
#
# Prerequisites:
#   Create GitHub Environments bootstrap-dev / bootstrap-stg / bootstrap-prod,
#   each with AWS_BOOTSTRAP_ACCESS_KEY_ID and AWS_BOOTSTRAP_SECRET_ACCESS_KEY
#   for the respective AWS account's temporary IAM user.
#
# After each run:
#   Register the output ARNs in GitHub Secrets / Environments, then delete
#   the bootstrap IAM user and credentials.
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to bootstrap"
        required: true
        type: choice
        options:
          - dev
          - stg
          - prod
        default: dev

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Each bootstrap-<env> GitHub Environment holds AWS credentials for that account.
    environment: bootstrap-${{ inputs.target_environment }}

    env:
      ENVIRONMENT: ${{ inputs.target_environment }}
      AWS_REGION: ap-northeast-1

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (temporary bootstrap user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure state bucket for bootstrap backend
        run: |
          BUCKET="cicd-demo-terraform-${ENVIRONMENT}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "$BUCKET already exists"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            echo "Created $BUCKET"
          fi

          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration '{
              "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
            }'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: bootstrap/${{ env.ENVIRONMENT }}
        run: terraform init

      - name: Terraform Apply
        working-directory: bootstrap/${{ env.ENVIRONMENT }}
        run: terraform apply -auto-approve

      - name: Show next steps in Step Summary
        working-directory: bootstrap/${{ env.ENVIRONMENT }}
        run: |
          UPPER_ENV=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          PLAN_ARN=$(terraform output -raw terraform_plan_role_arn)
          APPLY_ARN=$(terraform output -raw terraform_apply_role_arn)
          DEPLOY_ARN=$(terraform output -raw app_deploy_role_arn)

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Bootstrap 完了 — ${ENVIRONMENT}

          ### 1. terraform-repo Repository Secrets

          | Secret 名 | 値 |
          |-----------|---|
          | \`AWS_TERRAFORM_PLAN_ROLE_ARN_${UPPER_ENV}\` | \`${PLAN_ARN}\` |

          ### 2. terraform-repo GitHub Environment \`${ENVIRONMENT}\`

          | Secret 名 | 値 |
          |-----------|---|
          | \`AWS_TERRAFORM_ROLE_ARN\` | \`${APPLY_ARN}\` |

          ### 3. app-repo GitHub Environment \`${ENVIRONMENT}\`

          | Secret 名 | 値 |
          |-----------|---|
          | \`AWS_DEPLOY_ROLE_ARN\` | \`${DEPLOY_ARN}\` |

          ### 4. 後片付け（登録完了後）

          - GitHub Environment \`bootstrap-${ENVIRONMENT}\` から \`AWS_BOOTSTRAP_ACCESS_KEY_ID\` を削除
          - GitHub Environment \`bootstrap-${ENVIRONMENT}\` から \`AWS_BOOTSTRAP_SECRET_ACCESS_KEY\` を削除
          - AWS Console の bootstrap 用 IAM User を削除
          EOF
