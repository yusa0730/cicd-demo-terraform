name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - stg
          - prod
        default: dev
      confirm:
        description: "dev/stg: type 'destroy' / prod: type 'destroy-prod'"
        required: true
        type: string

concurrency:
  group: terraform-destroy-${{ github.event.inputs.target_environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-input:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
    steps:
      - name: Validate confirmation
        id: validate
        run: |
          ENVIRONMENT="${{ github.event.inputs.target_environment }}"
          CONFIRM="${{ github.event.inputs.confirm }}"

          if [ "$ENVIRONMENT" = "prod" ]; then
            EXPECTED="destroy-prod"
          else
            EXPECTED="destroy"
          fi

          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "確認文字列が正しくありません。'$EXPECTED' と入力してください（入力値: '$CONFIRM'）"
            exit 1
          fi

          case "$ENVIRONMENT" in
            dev|stg|prod)
              echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

  # ── dev: app スタックのみ plan して削除内容を確認 ─────────────────────────
  destroy-plan-dev:
    needs: validate-input
    if: needs.validate-input.outputs.environment == 'dev'
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ needs.validate-input.outputs.environment }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Terraform Init (app)
        working-directory: environments/${{ env.ENVIRONMENT }}/app
        run: terraform init

      - name: Terraform Destroy Plan (app)
        working-directory: environments/${{ env.ENVIRONMENT }}/app
        run: terraform plan -destroy -no-color -out=tfplan

      - name: Summarize deletion count
        working-directory: environments/${{ env.ENVIRONMENT }}/app
        run: |
          DELETE_COUNT=$(terraform show -json tfplan \
            | jq '[.resource_changes[] | select(.change.actions[] | contains("delete"))] | length')
          echo "### Terraform Destroy Plan — $ENVIRONMENT (app stack preview)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 値 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| app スタック削除リソース数 | $DELETE_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack destroy plan created
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform destroy plan created — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :rotating_light: *Terraform destroy plan created — awaiting approval*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

  # ── dev: app → data → base の順に destroy ────────────────────────────────
  destroy-apply-dev:
    needs:
      - validate-input
      - destroy-plan-dev
    if: needs.validate-input.outputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate-input.outputs.environment }}

    env:
      ENVIRONMENT: ${{ needs.validate-input.outputs.environment }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Release stale state locks if exist
        run: |
          set -euo pipefail
          BUCKET="cicd-demo-terraform-dev"

          release_if_stale() {
            local STACK="$1"
            local KEY="ecs-demo/dev/${STACK}/terraform.tfstate.tflock"
            local CONTENT
            CONTENT=$(aws s3 cp "s3://${BUCKET}/${KEY}" - 2>/dev/null || echo "")
            if [ -z "$CONTENT" ]; then
              echo "[$STACK] ロックなし"
              return
            fi

            local CREATED WHO AGE_SEC=0
            CREATED=$(echo "$CONTENT" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('Created',''))" 2>/dev/null || echo "")
            WHO=$(echo "$CONTENT" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('Who','unknown'))" 2>/dev/null || echo "unknown")

            if [ -n "$CREATED" ]; then
              LOCK_EPOCH=$(python3 -c "from datetime import datetime,timezone; \
                s='$CREATED'; s=s[:26]+'Z'; \
                dt=datetime.strptime(s,'%Y-%m-%dT%H:%M:%S.%fZ').replace(tzinfo=timezone.utc); \
                print(int(dt.timestamp()))" 2>/dev/null || echo "0")
              NOW_EPOCH=$(python3 -c "from datetime import datetime,timezone; \
                print(int(datetime.now(timezone.utc).timestamp()))")
              AGE_SEC=$((NOW_EPOCH - LOCK_EPOCH))
            fi

            echo "[$STACK] ロック検出: WHO=$WHO, AGE=${AGE_SEC}秒"
            if [ "$AGE_SEC" -ge 3600 ]; then
              aws s3 rm "s3://${BUCKET}/${KEY}"
              echo "[$STACK] 1時間以上経過のため自動解除しました"
            else
              echo "::warning::[$STACK] ロックが存在 (AGE=${AGE_SEC}秒, WHO=$WHO)。60分未満のため自動解除しません。"
            fi
          }

          release_if_stale "base"
          release_if_stale "data"
          release_if_stale "app"

      - name: Empty ECR repository before destroy
        run: |
          set -euo pipefail
          ECR_URL=$(aws ssm get-parameter \
            --name "/ecs-demo/${ENVIRONMENT}/ecr-repository-url" \
            --with-decryption \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [ -z "$ECR_URL" ]; then
            echo "SSM parameter not found — skipping ECR cleanup"
            exit 0
          fi

          ECR_REPO_NAME="$(basename "$ECR_URL")"
          IMAGE_IDS=$(aws ecr list-images \
            --repository-name "$ECR_REPO_NAME" \
            --query 'imageIds[*]' --output json)

          if [ "$IMAGE_IDS" = "[]" ] || [ -z "$IMAGE_IDS" ]; then
            echo "No images to delete in $ECR_REPO_NAME"
            exit 0
          fi

          echo "Deleting all images from $ECR_REPO_NAME..."
          aws ecr batch-delete-image \
            --repository-name "$ECR_REPO_NAME" \
            --image-ids "$IMAGE_IDS"
          echo "ECR cleanup complete"

      - name: Terraform Init + Destroy (app)
        working-directory: environments/${{ env.ENVIRONMENT }}/app
        run: |
          terraform init
          terraform plan -destroy -no-color -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Terraform Init + Destroy (data)
        working-directory: environments/${{ env.ENVIRONMENT }}/data
        run: |
          terraform init
          terraform plan -destroy -no-color -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Terraform Init + Destroy (base)
        working-directory: environments/${{ env.ENVIRONMENT }}/base
        run: |
          terraform init
          terraform plan -destroy -no-color -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Notify Slack destroy result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform destroy ${{ job.status == 'success' && 'success' || 'failure' }} — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :rotating_light: *Terraform destroy ${{ job.status }}*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

  # ── stg / prod: 単一スタック plan ────────────────────────────────────────
  destroy-plan:
    needs: validate-input
    if: needs.validate-input.outputs.environment != 'dev'
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ needs.validate-input.outputs.environment }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select IAM role for destroy plan
        id: role
        run: |
          case "$ENVIRONMENT" in
            stg)  echo "arn=${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_STG }}"  >> "$GITHUB_OUTPUT" ;;
            prod) echo "arn=${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials for destroy plan
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform init

      - name: Terraform Destroy Plan
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform plan -destroy -no-color -out=tfplan

      - name: Summarize deletion count
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: |
          DELETE_COUNT=$(terraform show -json tfplan \
            | jq '[.resource_changes[] | select(.change.actions[] | contains("delete"))] | length')
          echo "### Terraform Destroy Plan — $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> [!CAUTION]" >> "$GITHUB_STEP_SUMMARY"
            echo "> **本番環境のリソースを削除します。承認前に内容を必ず確認してください。**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 値 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 削除されるリソース数 | $DELETE_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-destroy-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: environments/${{ env.ENVIRONMENT }}/tfplan
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack destroy plan created
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform destroy plan created — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :rotating_light: *Terraform destroy plan created — awaiting approval*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

  # ── stg / prod: 単一スタック apply ───────────────────────────────────────
  destroy-apply:
    needs:
      - validate-input
      - destroy-plan
    if: needs.validate-input.outputs.environment != 'dev'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate-input.outputs.environment }}

    env:
      ENVIRONMENT: ${{ needs.validate-input.outputs.environment }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials for destroy apply
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform init

      - name: Empty ECR repository before destroy
        run: |
          set -euo pipefail
          ECR_URL=$(aws ssm get-parameter \
            --name "/ecs-demo/${ENVIRONMENT}/ecr-repository-url" \
            --with-decryption \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [ -z "$ECR_URL" ]; then
            echo "SSM parameter not found — skipping ECR cleanup"
            exit 0
          fi

          ECR_REPO_NAME="$(basename "$ECR_URL")"
          IMAGE_IDS=$(aws ecr list-images \
            --repository-name "$ECR_REPO_NAME" \
            --query 'imageIds[*]' --output json)

          if [ "$IMAGE_IDS" = "[]" ] || [ -z "$IMAGE_IDS" ]; then
            echo "No images to delete in $ECR_REPO_NAME"
            exit 0
          fi

          echo "Deleting all images from $ECR_REPO_NAME..."
          aws ecr batch-delete-image \
            --repository-name "$ECR_REPO_NAME" \
            --image-ids "$IMAGE_IDS"
          echo "ECR cleanup complete"

      - name: Download destroy plan artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-destroy-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: environments/${{ env.ENVIRONMENT }}

      - name: Verify destroy plan artifact exists
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: test -f tfplan

      - name: Terraform Apply Destroy Plan
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform apply -auto-approve tfplan

      - name: Notify Slack destroy result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform destroy ${{ job.status == 'success' && 'success' || 'failure' }} — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :rotating_light: *Terraform destroy ${{ job.status }}*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>
