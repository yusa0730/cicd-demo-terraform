name: _reusable-terraform-apply

# 非 prod 環境の apply 用リユーザブルワークフロー
# apply workflow 内で plan を作成し、直後に apply する
# prod は terraform-apply.yml 内にインライン実装（artifact + 承認ゲートのため）

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev / stg)"
        type: string
        required: true
      stack:
        description: "Target stack (base / data / app)"
        type: string
        required: true
      working_directory:
        description: "Terraform working directory (e.g. environments/dev/base)"
        type: string
        required: true
      checkout_ref:
        description: "Git ref to checkout (PR base branch)"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: ubuntu-latest
    # AWS_TERRAFORM_ROLE_ARN は Environment Secret として各環境に設定
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      STACK: ${{ inputs.stack }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Release stale state lock if exists
        env:
          BUCKET: cicd-demo-terraform-${{ inputs.environment }}
          KEY: ecs-demo/${{ inputs.environment }}/${{ inputs.stack }}/terraform.tfstate.tflock
        run: |
          set -euo pipefail
          CONTENT=$(aws s3 cp "s3://${BUCKET}/${KEY}" - 2>/dev/null || echo "")
          if [ -z "$CONTENT" ]; then
            echo "ロックなし — 続行"
            exit 0
          fi

          CREATED=$(echo "$CONTENT" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('Created',''))" 2>/dev/null || echo "")
          WHO=$(echo "$CONTENT" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('Who','unknown'))" 2>/dev/null || echo "unknown")

          AGE_SEC=0
          if [ -n "$CREATED" ]; then
            LOCK_EPOCH=$(python3 -c "from datetime import datetime,timezone; \
              s='$CREATED'; s=s[:26]+'Z'; \
              dt=datetime.strptime(s,'%Y-%m-%dT%H:%M:%S.%fZ').replace(tzinfo=timezone.utc); \
              print(int(dt.timestamp()))" 2>/dev/null || echo "0")
            NOW_EPOCH=$(python3 -c "from datetime import datetime,timezone; \
              print(int(datetime.now(timezone.utc).timestamp()))")
            AGE_SEC=$((NOW_EPOCH - LOCK_EPOCH))
          fi

          echo "ロック検出: WHO=$WHO, AGE=${AGE_SEC}秒"

          if [ "$AGE_SEC" -ge 3600 ]; then
            echo "ロックが1時間以上経過しているため解除します"
            aws s3 rm "s3://${BUCKET}/${KEY}"
            echo "ロック解除完了"
          else
            echo "::warning::ロックが存在します (AGE=${AGE_SEC}秒, WHO=$WHO)。60分未満のため自動解除しません。"
            echo "別のジョブが実行中の可能性があります。terraform-unlock ワークフローで手動解除してください。"
          fi

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ inputs.working_directory }}
        run: terraform plan -no-color -out=tfplan

      - name: Detect destructive changes
        id: destructive
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform show -json tfplan > tfplan.json

          DELETE_COUNT=$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' tfplan.json)
          REPLACE_COUNT=$(jq '[.resource_changes[]? | select(.change.actions == ["delete","create"] or .change.actions == ["create","delete"])] | length' tfplan.json)

          echo "delete_count=${DELETE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "replace_count=${REPLACE_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$DELETE_COUNT" -gt 0 ] || [ "$REPLACE_COUNT" -gt 0 ]; then
            echo "has_destructive_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack destructive plan
        if: steps.destructive.outputs.has_destructive_changes == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform destructive plan — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :warning: *Terraform plan contains destructive changes*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Delete:* `${{ steps.destructive.outputs.delete_count }}`
                    *Replace:* `${{ steps.destructive.outputs.replace_count }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

      - name: Show plan in Step Summary
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "### Terraform Plan — $ENVIRONMENT/$STACK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        if: env.STACK == 'app'
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "### Terraform Outputs — $ENVIRONMENT/$STACK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "alb_dns_name        = %s\n" "$(terraform output -raw -no-color alb_dns_name)"       >> "$GITHUB_STEP_SUMMARY"
          printf "ecr_repository_url  = %s\n" "$(terraform output -raw -no-color ecr_repository_url)" >> "$GITHUB_STEP_SUMMARY"
          printf "ssm_prefix          = %s\n" "$(terraform output -raw -no-color ssm_prefix)"         >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack apply result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform apply ${{ job.status == 'success' && 'success' || 'failure' }} — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *Terraform apply ${{ job.status }}*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Repository:* `${{ github.repository }}`
                    *Branch:* `${{ github.event.pull_request.base.ref }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>
