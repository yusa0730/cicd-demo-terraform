name: terraform-plan

on:
  pull_request:
    branches:
      - develop
      - stg
      - prod
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          case "${{ github.base_ref }}" in
            develop) echo "environment=dev"  >> "$GITHUB_OUTPUT" ;;
            stg)     echo "environment=stg"  >> "$GITHUB_OUTPUT" ;;
            prod)    echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported target branch: ${{ github.base_ref }}"
              exit 1
              ;;
          esac

  plan:
    needs: [fmt, resolve-environment]
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Select IAM role
        id: role
        run: |
          case "$ENVIRONMENT" in
            dev)  echo "arn=${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_DEV }}"  >> "$GITHUB_OUTPUT" ;;
            stg)  echo "arn=${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_STG }}"  >> "$GITHUB_OUTPUT" ;;
            prod) echo "arn=${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_PROD }}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform init

      - name: Terraform validate
        id: validate
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Show plan in Step Summary
        if: steps.plan.outcome == 'success'
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: |
          echo "### Terraform Plan — $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan status to PR
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const env    = process.env.ENVIRONMENT;
            const val    = process.env.VALIDATE_OUTCOME === 'success' ? '✅' : '❌';
            const plan   = process.env.PLAN_OUTCOME     === 'success' ? '✅' : '❌';
            const url    = process.env.SUMMARY_URL;
            const marker = `<!-- terraform-plan-${env} -->`;

            const body = [
              marker,
              `## Terraform Plan — \`${env}\``,
              '',
              '| Step     | Status |',
              '|----------|--------|',
              `| validate | ${val}  |`,
              `| plan     | ${plan} |`,
              '',
              `[View full plan output in Step Summary](${url})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
