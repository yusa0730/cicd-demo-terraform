name: terraform-plan

on:
  pull_request:
    branches:
      - develop
      - stg
      - prod

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          case "${{ github.base_ref }}" in
            develop) echo "environment=dev"  >> "$GITHUB_OUTPUT" ;;
            stg)     echo "environment=stg"  >> "$GITHUB_OUTPUT" ;;
            prod)    echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported target branch: ${{ github.base_ref }}"
              exit 1
              ;;
          esac

  plan-base:
    needs:
      - fmt
      - resolve-environment
    uses: ./.github/workflows/_reusable-terraform-plan.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      stack: base
      working_directory: environments/${{ needs.resolve-environment.outputs.environment }}/base
    secrets: inherit

  plan-data:
    needs:
      - fmt
      - resolve-environment
    uses: ./.github/workflows/_reusable-terraform-plan.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      stack: data
      working_directory: environments/${{ needs.resolve-environment.outputs.environment }}/data
    secrets: inherit

  plan-app:
    needs:
      - fmt
      - resolve-environment
    uses: ./.github/workflows/_reusable-terraform-plan.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      stack: app
      working_directory: environments/${{ needs.resolve-environment.outputs.environment }}/app
    secrets: inherit

  # Branch Protection はこの job だけを Required check に設定する。
  # reusable workflow の job 名が階層化されても check 名が安定する。
  required:
    needs:
      - fmt
      - plan-base
      - plan-data
      - plan-app
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.fmt.result }}"       != "success" ||
                "${{ needs.plan-base.result }}" != "success" ||
                "${{ needs.plan-data.result }}" != "success" ||
                "${{ needs.plan-app.result }}"  != "success" ]]; then
            echo "fmt:       ${{ needs.fmt.result }}"
            echo "plan-base: ${{ needs.plan-base.result }}"
            echo "plan-data: ${{ needs.plan-data.result }}"
            echo "plan-app:  ${{ needs.plan-app.result }}"
            exit 1
          fi

  notify-plan-failure:
    needs:
      - fmt
      - plan-base
      - plan-data
      - plan-app
      - required
    if: always() && needs.required.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack plan failure
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform plan failed — ${{ github.base_ref }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :x: *Terraform plan failed*
                    *Repository:* `${{ github.repository }}`
                    *PR:* <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>
                    *Branch:* `${{ github.head_ref }} → ${{ github.base_ref }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>
