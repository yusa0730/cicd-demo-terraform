name: terraform-apply

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - stg
      - prod

concurrency:
  group: terraform-apply-${{ github.base_ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  resolve-environment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          case "${{ github.base_ref }}" in
            develop) echo "environment=dev"  >> "$GITHUB_OUTPUT" ;;
            stg)     echo "environment=stg"  >> "$GITHUB_OUTPUT" ;;
            prod)    echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported base branch: ${{ github.base_ref }}"
              exit 1
              ;;
          esac

  # dev / stg: plan + apply をリユーザブルワークフローで実行
  apply-non-prod:
    needs: resolve-environment
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment != 'prod'
    uses: ./.github/workflows/_reusable-terraform-apply.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      working_directory: environments/${{ needs.resolve-environment.outputs.environment }}
      checkout_ref: ${{ github.event.pull_request.base.ref }}
    secrets: inherit

  # prod: plan → artifact 保存 → 承認ゲート → apply
  prod-plan:
    needs: resolve-environment
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'prod'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_Linux_x86_64.tar.gz \
            | tar xz conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init

      - name: Terraform Plan
        working-directory: environments/prod
        run: terraform plan -no-color -out=tfplan

      - name: Detect destructive changes
        id: destructive
        working-directory: environments/prod
        run: |
          terraform show -json tfplan > tfplan.json

          DELETE_COUNT=$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' tfplan.json)
          REPLACE_COUNT=$(jq '[.resource_changes[]? | select(.change.actions == ["delete","create"] or .change.actions == ["create","delete"])] | length' tfplan.json)

          echo "delete_count=${DELETE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "replace_count=${REPLACE_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$DELETE_COUNT" -gt 0 ] || [ "$REPLACE_COUNT" -gt 0 ]; then
            echo "has_destructive_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack destructive plan
        if: steps.destructive.outputs.has_destructive_changes == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform plan contains destructive changes - prod"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :warning: *Terraform plan contains destructive changes*
                    *Environment:* `prod`
                    *Delete:* `${{ steps.destructive.outputs.delete_count }}`
                    *Replace:* `${{ steps.destructive.outputs.replace_count }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

      - name: Run conftest security checks
        working-directory: environments/prod
        run: |
          terraform show -json tfplan > tfplan.json
          conftest test tfplan.json -p "$GITHUB_WORKSPACE/policy"

      - name: Show plan in Step Summary
        working-directory: environments/prod
        run: |
          echo "### Terraform Plan — prod" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: environments/prod/tfplan
          retention-days: 1
          if-no-files-found: error

  prod-apply:
    needs:
      - resolve-environment
      - prod-plan
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'prod'
    runs-on: ubuntu-latest

    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: environments/prod

      - name: Verify plan artifact exists
        working-directory: environments/prod
        run: test -f tfplan

      - name: Terraform Apply
        working-directory: environments/prod
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        working-directory: environments/prod
        run: |
          echo "### Terraform Outputs — prod" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "alb_dns_name        = %s\n" "$(terraform output -raw -no-color alb_dns_name)"       >> "$GITHUB_STEP_SUMMARY"
          printf "ecr_repository_url  = %s\n" "$(terraform output -raw -no-color ecr_repository_url)" >> "$GITHUB_STEP_SUMMARY"
          printf "ssm_prefix          = %s\n" "$(terraform output -raw -no-color ssm_prefix)"         >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack apply result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform apply ${{ job.status }} - prod"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *Terraform apply ${{ job.status }}*
                    *Environment:* `prod`
                    *Repository:* `${{ github.repository }}`
                    *Branch:* `${{ github.event.pull_request.base.ref }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>
