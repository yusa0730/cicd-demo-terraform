name: terraform-apply

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - stg
      - prod

concurrency:
  group: terraform-apply-${{ github.base_ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-environment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          case "${{ github.base_ref }}" in
            develop) echo "environment=dev"  >> "$GITHUB_OUTPUT" ;;
            stg)     echo "environment=stg"  >> "$GITHUB_OUTPUT" ;;
            prod)    echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported base branch: ${{ github.base_ref }}"
              exit 1
              ;;
          esac

  # stg: base → data → app を順番に plan + apply
  apply-stg-base:
    needs: resolve-environment
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'stg'
    uses: ./.github/workflows/_reusable-terraform-apply.yml
    with:
      environment: stg
      stack: base
      working_directory: environments/stg/base
      checkout_ref: ${{ github.event.pull_request.base.ref }}
    secrets: inherit

  apply-stg-data:
    needs: [resolve-environment, apply-stg-base]
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'stg'
    uses: ./.github/workflows/_reusable-terraform-apply.yml
    with:
      environment: stg
      stack: data
      working_directory: environments/stg/data
      checkout_ref: ${{ github.event.pull_request.base.ref }}
    secrets: inherit

  apply-stg-app:
    needs: [resolve-environment, apply-stg-data]
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'stg'
    uses: ./.github/workflows/_reusable-terraform-apply.yml
    with:
      environment: stg
      stack: app
      working_directory: environments/stg/app
      checkout_ref: ${{ github.event.pull_request.base.ref }}
    secrets: inherit

  # dev: base → data → app を plan → artifact 保存 → 承認ゲート → apply の順で実行
  dev-plan:
    needs: resolve-environment
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Install conftest
        run: |
          set -euxo pipefail
          CONFTEST_VERSION="0.68.2"
          curl --fail --location --show-error -o /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf /tmp/conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Terraform Init — base
        working-directory: environments/dev/base
        run: terraform init

      - name: Terraform Plan — base
        working-directory: environments/dev/base
        run: terraform plan -no-color -out=tfplan

      - name: conftest — base
        working-directory: environments/dev/base
        run: |
          terraform show -json tfplan > tfplan.json
          conftest test tfplan.json -p "$GITHUB_WORKSPACE/policy"

      - name: Show plan in Step Summary — base
        working-directory: environments/dev/base
        run: |
          echo "### Terraform Plan — dev/base" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Init — data
        working-directory: environments/dev/data
        run: terraform init

      - name: Terraform Plan — data
        working-directory: environments/dev/data
        run: terraform plan -no-color -out=tfplan

      - name: conftest — data
        working-directory: environments/dev/data
        run: |
          terraform show -json tfplan > tfplan.json
          conftest test tfplan.json -p "$GITHUB_WORKSPACE/policy"

      - name: Show plan in Step Summary — data
        working-directory: environments/dev/data
        run: |
          echo "### Terraform Plan — dev/data" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Init — app
        working-directory: environments/dev/app
        run: terraform init

      - name: Terraform Plan — app
        working-directory: environments/dev/app
        run: terraform plan -no-color -out=tfplan

      - name: conftest — app
        working-directory: environments/dev/app
        run: |
          terraform show -json tfplan > tfplan.json
          conftest test tfplan.json -p "$GITHUB_WORKSPACE/policy"

      - name: Show plan in Step Summary — app
        working-directory: environments/dev/app
        run: |
          echo "### Terraform Plan — dev/app" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Detect destructive changes (all stacks)
        id: destructive
        run: |
          TOTAL_DELETE=0
          TOTAL_REPLACE=0
          for stack in base data app; do
            PLAN_JSON="environments/dev/${stack}/tfplan.json"
            DELETE=$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")
            REPLACE=$(jq '[.resource_changes[]? | select(.change.actions == ["delete","create"] or .change.actions == ["create","delete"])] | length' "$PLAN_JSON")
            TOTAL_DELETE=$((TOTAL_DELETE + DELETE))
            TOTAL_REPLACE=$((TOTAL_REPLACE + REPLACE))
          done
          echo "delete_count=${TOTAL_DELETE}"   >> "$GITHUB_OUTPUT"
          echo "replace_count=${TOTAL_REPLACE}" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL_DELETE" -gt 0 ] || [ "$TOTAL_REPLACE" -gt 0 ]; then
            echo "has_destructive_changes=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack destructive plan
        if: steps.destructive.outputs.has_destructive_changes == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform destructive plan — dev"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :warning: *Terraform plan contains destructive changes*
                    *Environment:* `dev`
                    *Delete:* `${{ steps.destructive.outputs.delete_count }}`
                    *Replace:* `${{ steps.destructive.outputs.replace_count }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

      - name: Upload plan artifact — base
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-dev-base-${{ github.run_id }}
          path: environments/dev/base/tfplan
          retention-days: 1
          if-no-files-found: error

  dev-apply:
    needs:
      - resolve-environment
      - dev-plan
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'dev'
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Download plan artifact — base
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-dev-base-${{ github.run_id }}
          path: environments/dev/base

      - name: Terraform Init — base
        working-directory: environments/dev/base
        run: terraform init

      - name: Verify & Apply — base
        working-directory: environments/dev/base
        run: |
          test -f tfplan
          terraform apply -auto-approve tfplan

      - name: Terraform Init — data
        working-directory: environments/dev/data
        run: terraform init

      - name: Terraform Plan — data
        working-directory: environments/dev/data
        run: terraform plan -no-color -out=tfplan

      - name: Apply — data
        working-directory: environments/dev/data
        run: terraform apply -auto-approve tfplan

      - name: Terraform Init — app
        working-directory: environments/dev/app
        run: terraform init

      - name: Terraform Plan — app
        working-directory: environments/dev/app
        run: terraform plan -no-color -out=tfplan

      - name: Apply — app
        working-directory: environments/dev/app
        run: terraform apply -auto-approve tfplan

      - name: Show outputs — app
        working-directory: environments/dev/app
        run: |
          echo "### Terraform Outputs — dev/app" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "alb_dns_name        = %s\n" "$(terraform output -raw -no-color alb_dns_name)"       >> "$GITHUB_STEP_SUMMARY"
          printf "ecr_repository_url  = %s\n" "$(terraform output -raw -no-color ecr_repository_url)" >> "$GITHUB_STEP_SUMMARY"
          printf "ssm_prefix          = %s\n" "$(terraform output -raw -no-color ssm_prefix)"         >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack apply result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform apply ${{ job.status == 'success' && 'success' || 'failure' }} — dev"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *Terraform apply ${{ job.status }}*
                    *Environment:* `dev`
                    *Repository:* `${{ github.repository }}`
                    *Branch:* `${{ github.event.pull_request.base.ref }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

  # prod: base → data → app を plan → artifact 保存 → 承認ゲート → apply の順で実行
  prod-plan:
    needs: resolve-environment
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'prod'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Install conftest
        run: |
          set -euxo pipefail
          CONFTEST_VERSION="0.68.2"
          curl --fail --location --show-error -o /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf /tmp/conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Terraform Init — base
        working-directory: environments/prod/base
        run: terraform init

      - name: Terraform Plan — base
        working-directory: environments/prod/base
        run: terraform plan -no-color -out=tfplan

      - name: conftest — base
        working-directory: environments/prod/base
        run: |
          terraform show -json tfplan > tfplan.json
          conftest test tfplan.json -p "$GITHUB_WORKSPACE/policy"

      - name: Show plan in Step Summary — base
        working-directory: environments/prod/base
        run: |
          echo "### Terraform Plan — prod/base" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Init — data
        working-directory: environments/prod/data
        run: terraform init

      - name: Terraform Plan — data
        working-directory: environments/prod/data
        run: terraform plan -no-color -out=tfplan

      - name: conftest — data
        working-directory: environments/prod/data
        run: |
          terraform show -json tfplan > tfplan.json
          conftest test tfplan.json -p "$GITHUB_WORKSPACE/policy"

      - name: Show plan in Step Summary — data
        working-directory: environments/prod/data
        run: |
          echo "### Terraform Plan — prod/data" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Init — app
        working-directory: environments/prod/app
        run: terraform init

      - name: Terraform Plan — app
        working-directory: environments/prod/app
        run: terraform plan -no-color -out=tfplan

      - name: conftest — app
        working-directory: environments/prod/app
        run: |
          terraform show -json tfplan > tfplan.json
          conftest test tfplan.json -p "$GITHUB_WORKSPACE/policy"

      - name: Show plan in Step Summary — app
        working-directory: environments/prod/app
        run: |
          echo "### Terraform Plan — prod/app" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Detect destructive changes (all stacks)
        id: destructive
        run: |
          TOTAL_DELETE=0
          TOTAL_REPLACE=0
          for stack in base data app; do
            PLAN_JSON="environments/prod/${stack}/tfplan.json"
            DELETE=$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")
            REPLACE=$(jq '[.resource_changes[]? | select(.change.actions == ["delete","create"] or .change.actions == ["create","delete"])] | length' "$PLAN_JSON")
            TOTAL_DELETE=$((TOTAL_DELETE + DELETE))
            TOTAL_REPLACE=$((TOTAL_REPLACE + REPLACE))
          done
          echo "delete_count=${TOTAL_DELETE}"   >> "$GITHUB_OUTPUT"
          echo "replace_count=${TOTAL_REPLACE}" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL_DELETE" -gt 0 ] || [ "$TOTAL_REPLACE" -gt 0 ]; then
            echo "has_destructive_changes=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack destructive plan
        if: steps.destructive.outputs.has_destructive_changes == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform destructive plan — prod"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :warning: *Terraform plan contains destructive changes*
                    *Environment:* `prod`
                    *Delete:* `${{ steps.destructive.outputs.delete_count }}`
                    *Replace:* `${{ steps.destructive.outputs.replace_count }}`
                    *Repository:* `${{ github.repository }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-prod-${{ github.run_id }}
          path: |
            environments/prod/base/tfplan
            environments/prod/data/tfplan
            environments/prod/app/tfplan
          retention-days: 1
          if-no-files-found: error

  prod-apply:
    needs:
      - resolve-environment
      - prod-plan
    if: github.event.pull_request.merged == true && needs.resolve-environment.outputs.environment == 'prod'
    runs-on: ubuntu-latest

    environment: prod

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.3"
          terraform_wrapper: false

      - name: Download plan artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-prod-${{ github.run_id }}

      - name: Terraform Init — base
        working-directory: environments/prod/base
        run: terraform init

      - name: Verify & Apply — base
        working-directory: environments/prod/base
        run: |
          test -f tfplan
          terraform apply -auto-approve tfplan

      - name: Terraform Init — data
        working-directory: environments/prod/data
        run: terraform init

      - name: Verify & Apply — data
        working-directory: environments/prod/data
        run: |
          test -f tfplan
          terraform apply -auto-approve tfplan

      - name: Terraform Init — app
        working-directory: environments/prod/app
        run: terraform init

      - name: Verify & Apply — app
        working-directory: environments/prod/app
        run: |
          test -f tfplan
          terraform apply -auto-approve tfplan

      - name: Show outputs — app
        working-directory: environments/prod/app
        run: |
          echo "### Terraform Outputs — prod/app" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "alb_dns_name        = %s\n" "$(terraform output -raw -no-color alb_dns_name)"       >> "$GITHUB_STEP_SUMMARY"
          printf "ecr_repository_url  = %s\n" "$(terraform output -raw -no-color ecr_repository_url)" >> "$GITHUB_STEP_SUMMARY"
          printf "ssm_prefix          = %s\n" "$(terraform output -raw -no-color ssm_prefix)"         >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack apply result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_TERRAFORM }}
            text: "Terraform apply ${{ job.status == 'success' && 'success' || 'failure' }} — prod"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *Terraform apply ${{ job.status }}*
                    *Environment:* `prod`
                    *Repository:* `${{ github.repository }}`
                    *Branch:* `${{ github.event.pull_request.base.ref }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>
